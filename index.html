Style it how ever you like. 
Look at the goal image for inspiration.
But it must have the following features:

  https://fonts.google.com/specimen/Libre+Baskerville

3. Add your own image into the images folder inside assets. It should have a 5px white border.

<html>
  <head>
    <style>
      .comic-relief-regular {
        font-family: "Comic Relief", system-ui;
        font-weight: 400;
        font-style: normal;
      }
      html {
        color: white;
        background-color: black;
        align-content: center;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #photo {
        height: 500px;
        width: 500px;
      }
      #title {
        font-family: "Comic Relief", system-ui;
        font-weight: 400;
        font-style: normal;
        text-align: center;
      }

      #photo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Comic+Relief&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="title"><h1>Sophie I'm watching you :)</h1></div>
    <div id="photo">
      <img src="./assets/images/IMG.JPG" alt="green" />
    </div>
  </body>
</html>
